name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK yig'ish
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          TM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/talabamakon.jks"
            export TM_KEYSTORE="$RUNNER_TEMP/talabamakon.jks"
            gradle -p android assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk TalabaMakon.apk
          else
            gradle -p android assembleDebug --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk TalabaMakon.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TalabaMakon-apk
          path: TalabaMakon.apk
